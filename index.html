<!DOCTYPE html>
<html lang="en">
<head>

<title>Vestara — Savage Daily Oracle</title>
<style>
  :root { --bg:#14100e; --ink:#f2ebdd; --dim:#b8ad99; --accent:#c13524; --rule:#2c2621; }

  body { background:var(--bg); color:var(--ink); font:17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, serif;
         min-height:100svh; display:grid; place-items:center; }
  main { max-width:560px; padding:48px 24px; text-align:center; }
  .seal { width:88px; height:88px; margin:0 auto 28px; border-radius:20px; background:var(--accent);
          display:grid; place-items:center; color:var(--ink); font-size:44px; font-weight:700; }
  h1 { font-size:38px; font-weight:650; margin-bottom:10px; }
  .tag { color:var(--dim); font-size:19px; margin-bottom:34px; }
  p { color:var(--dim); margin-bottom:28px; }
  .links a { color:var(--accent); text-decoration:none; margin:0 14px; font-size:16px; }
  .links a:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <div class="seal" aria-hidden="true">V</div>

  <p>A daily horoscope with teeth — computed on your device, written like an

  <nav class="links">
